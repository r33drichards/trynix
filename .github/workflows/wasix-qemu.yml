name: WASIX QEMU build

on:
  workflow_dispatch:
  push:
    branches: ['port/wasix-qemu']
    paths: ['ports/wasix/**', '.github/workflows/wasix-qemu.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config autoconf automake libtool-bin \
            make patch python3-pip xz-utils curl ca-certificates
          python3 -m pip install --user --break-system-packages pyelftools distlib
      - name: WASIX toolchain (pinned revisions)
        run: bash ports/wasix/ci-toolchain.sh
      - name: Build dependencies and QEMU
        run: bash ports/wasix/ci-build.sh
      - name: Guest cold boot and Lua
        run: |
set -euo pipefail
G="$RUNNER_TEMP/guest"; mkdir -p "$G/PACK" "$G/STAGING" "$G/SHARE"
python3 - "$G/PACK" <<"PY"
I+"import json, sys, urllib.request, hashlib, pathlib"
I+"pack = pathlib.Path(sys.argv[1])"
I+"pins = json.load(open('ports/wasix/pins.json'))['guest_sha256']"
I+"for name, want in pins.items():"
I+"    dest = pack / name"
I+"    with urllib.request.urlopen('https://trynix.dev/guest/' + name, timeout=180) as r:"
I+"        dest.write_bytes(r.read())"
I+"    got = hashlib.sha256(dest.read_bytes()).hexdigest()"
I+"    if got != want:"
I+"        raise SystemExit('guest file %s sha256 %s != pinned %s' % (name, got, want))"
I+"    print('verified guest %s %s' % (name, got[:12]))"
I+"PY"
node ports/wasix/prepare-lua.mjs "$G/STAGING"
python3 ports/wasix/prepare-mapped-share.py "$G/STAGING" "$G/SHARE"
python3 ports/wasix/run-guest.py "$RUNNER_TEMP/out/qemu/qemu-system-x86_64.wasm" "$G/PACK" "$G/SHARE" --timeout 300 --log "$G/guest.json" || true
REPORT=$(tr -d "\n" < "$G/guest.json" 2>/dev/null | cut -c1-380)
echo "::notice::guest-e2e ${REPORT:-no report produced}"
python3 - "$G/guest.json" <<"PY2"
I+"import json, sys, pathlib"
I+"p = pathlib.Path(sys.argv[1])"
I+"if not p.is_file(): raise SystemExit('guest report missing')"
I+"d = json.loads(p.read_text())"
I+"print('guest report:', d)"
I+"if d.get('result') != 'passed': raise SystemExit('guest e2e result=%s' % d.get('result'))"
I+"PY2"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasix-qemu-wasm
          path: |
            ${{ runner.temp }}/out/qemu/qemu-system-x86_64.wasm
            ${{ runner.temp }}/out/qemu/qemu-system-x86_64.wasm.sha256
          if-no-files-found: error
