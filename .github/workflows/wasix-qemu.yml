name: WASIX QEMU build

on:
  workflow_dispatch:
  push:
    branches: ['port/wasix-qemu']
    paths: ['ports/wasix/**', '.github/workflows/wasix-qemu.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      JOBS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config autoconf automake libtool-bin \
            make patch python3-pip xz-utils curl ca-certificates
          python3 -m pip install --user --break-system-packages pyelftools distlib
      - name: WASIX toolchain (pinned revisions)
        run: bash ports/wasix/ci-toolchain.sh
      - name: Build dependencies and QEMU
        run: bash ports/wasix/ci-build.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasix-qemu-wasm
          path: |
            ${{ runner.temp }}/wasix-build/out/qemu/qemu-system-x86_64.wasm
            ${{ runner.temp }}/wasix-build/out/qemu/qemu-system-x86_64.wasm.sha256
          if-no-files-found: error
